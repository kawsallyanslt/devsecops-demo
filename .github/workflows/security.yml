
name: Password Leak Detection

on: [push]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.30.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan for Password Leaks
        run: |
          gitleaks dir . --config .gitleaks.toml --verbose
